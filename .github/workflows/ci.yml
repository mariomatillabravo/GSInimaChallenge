name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to exact release tags (not moving major tags) so the pipeline only changes
# when we decide to update it, in the same spirit as the dependency lockfile.
jobs:
  backend:
    name: Backend (lint, type-check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # uv reads backend/.python-version and installs Python 3.12 if needed.
      - name: Install dependencies
        run: make install

      # Separate steps (instead of a single `make check`) show exactly which check failed.
      - name: Lint and formatting
        run: make lint

      - name: Type check
        run: make typecheck

      # The front-end types are generated from this file, so it must follow every API change.
      - name: OpenAPI document up to date
        run: make openapi-check

      # The tests run once, measuring coverage; the job fails below fail_under (pyproject.toml).
      - name: Tests with coverage
        run: make coverage

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 14

  frontend:
    name: Front-end (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The same Node major version as local development, read from frontend/.nvmrc.
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          # Reuses npm's download cache while package-lock.json does not change.
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make front-install

      - name: Lint and formatting
        run: make front-lint

      - name: Type check
        run: make front-typecheck

      - name: API types up to date
        run: make front-types-check

      # A coverage report without a threshold; the backend job enforces one.
      - name: Tests with coverage
        run: make front-coverage

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Production build
        run: make front-build

  docker:
    name: Docker stack (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The exact path an evaluator follows: build, start in demo mode, wait for the healthcheck.
      - name: Build and start the stack in demo mode
        run: docker compose up --detach --build --wait

      - name: Smoke test the API
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error \
            "http://localhost:8000/api/v1/stations/juan-carlos-i/measurements?start=2025-03-30T00:00:00&end=2025-03-30T06:00:00&aggregation=hourly" \
            | python3 -c 'import json, sys; m = json.load(sys.stdin)["metadata"]; assert m["source"] == "demo" and m["count"] > 0, m; print(m)'

      # What a browser does: load the page, then call the API through nginx on the same origin.
      # Responses are saved to files before searching them: with pipefail (the default shell
      # options), `curl | grep --quiet` can fail when grep stops reading before curl is done.
      - name: Smoke test the web app through nginx
        run: |
          curl --fail --silent --show-error --output index.html http://localhost:8080/
          grep --quiet '<div id="root"></div>' index.html
          curl --fail --silent --show-error --dump-header meta.headers --output meta.json \
            http://localhost:8080/api/v1/meta
          grep --quiet --ignore-case '^x-request-id:' meta.headers
          python3 -c 'import json; m = json.load(open("meta.json")); assert m["source"] == "demo", m; print(m["source"])'
          # Built assets have a content hash in their name, so nginx lets browsers cache them for a year.
          asset=$(grep --only-matching --max-count=1 '/assets/index-[^"]*\.js' index.html)
          curl --fail --silent --show-error --head --output asset.headers "http://localhost:8080${asset}"
          grep --quiet --ignore-case '^cache-control:.*immutable' asset.headers

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
