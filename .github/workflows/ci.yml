name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to exact release tags (not moving major tags) so the pipeline only changes
# when we decide to update it, in the same spirit as the dependency lockfile.
jobs:
  backend:
    name: Backend (lint, type-check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      # uv reads backend/.python-version and installs Python 3.12 if needed.
      - name: Install dependencies
        run: make install

      # Separate steps (instead of a single `make check`) show exactly which check failed.
      - name: Lint and formatting
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test

  frontend:
    name: Front-end (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The same Node major version as local development, read from frontend/.nvmrc.
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: make front-install

      - name: Lint and formatting
        run: make front-lint

      - name: Type check
        run: make front-typecheck

      - name: Tests
        run: make front-test

      - name: Production build
        run: make front-build

  docker:
    name: Docker stack (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The exact path an evaluator follows: build, start in demo mode, wait for the healthcheck.
      - name: Build and start the stack in demo mode
        run: docker compose up --detach --build --wait

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error \
            "http://localhost:8000/api/v1/stations/juan-carlos-i/measurements?start=2025-03-30T00:00:00&end=2025-03-30T06:00:00&aggregation=hourly" \
            | python3 -c 'import json, sys; m = json.load(sys.stdin)["metadata"]; assert m["source"] == "demo" and m["count"] > 0, m; print(m)'

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
