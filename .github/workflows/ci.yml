name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, type-check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      # uv reads backend/.python-version and installs Python 3.12 if needed.
      - name: Install dependencies
        run: make install

      # Separate steps (instead of a single `make check`) show exactly which check failed.
      - name: Lint and formatting
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test
