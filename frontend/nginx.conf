# Serves the built web app and forwards API calls to the api service, so the browser only talks to
# one origin (no CORS), as the Vite dev server does in development.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Browsers must not guess content types, and links send only the origin to other sites.
    # add_header inside a location replaces these, so the locations that add headers repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API compresses its own JSON; nginx compresses the scripts and styles (HTML always).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # With an empty cache, a long range is fetched from AEMET month by month, which can take
        # minutes; nginx's default of 60 seconds would cut the answer.
        proxy_read_timeout 300s;
    }

    # Built file names contain a hash of their content, so a new build gets new names: these
    # files never change and can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html names the current assets: browsers revalidate it on every visit, so a new
    # deployment is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
