[project]
name = "aemet-antarctica-api"
version = "0.1.0"
description = "Web API that retrieves, caches and aggregates Antarctic weather data from AEMET OpenData."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    # Only used internally by Starlette's TestClient, which prefers httpx2 over httpx.
    # Application code uses httpx (stable and supported by respx for mocking AEMET).
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

# ---------------------------------------------------------------------------
# Ruff: linter and formatter (target Python version is inferred from requires-python)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports and variables, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify: simpler equivalent constructs
    "DTZ", # flake8-datetimez: forbids naive datetimes
    "PT",  # flake8-pytest-style: idiomatic pytest
    "RUF", # Ruff-specific rules
]

# ---------------------------------------------------------------------------
# Mypy: static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]
# Teaches mypy how Pydantic models validate their input (e.g. str -> SecretStr, BaseSettings' _env_file).
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true  # a misspelled keyword argument in a model constructor is a type error

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
